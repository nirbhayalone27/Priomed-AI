version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: priomed_user
      POSTGRES_PASSWORD: lab123password
      POSTGRES_DB: priomed_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://priomed_user:lab123password@db:5432/priomed_db
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data:
